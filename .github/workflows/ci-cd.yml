name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [docker-php-updated, docker-php-swoole-updated]
  schedule:
    - cron: '43 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOCKER_BUILDKIT: 1

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ['8.2', '8.3', '8.4']

    steps:
      - name: Checkout code
        uses: actions/checkout@v3.3.0

      - name: Check generated Dockerfiles
        run: python3 tests/check-generated.py

      - name: Build
        run: |
          docker build --pull -t kooldev/php:${{ matrix.version }}-oci8-nginx ${{ matrix.version }}-oci8-nginx
          docker build --pull -t kooldev/php:${{ matrix.version }}-oci8-nginx-prod ${{ matrix.version }}-oci8-nginx-prod

          docker build --pull -t kooldev/php:${{ matrix.version }}-oci8-swoole-nginx ${{ matrix.version }}-oci8-swoole-nginx
          docker build --pull -t kooldev/php:${{ matrix.version }}-oci8-swoole-nginx-prod ${{ matrix.version }}-oci8-swoole-nginx-prod

      - name: Tests
        run: |
          for variant in nginx nginx-prod swoole-nginx swoole-nginx-prod; do
            image="${{ matrix.version }}-oci8-${variant}"
            bash tests/test-image.sh "kooldev/php:${image}" "${image}/Dockerfile"
          done

      - name: Login to DockerHub
        uses: docker/login-action@v2.1.0
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'kool-dev/docker-php-oci8'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push to DockerHub
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'kool-dev/docker-php-oci8'
        run: |
          docker push kooldev/php:${{ matrix.version }}-oci8-nginx
          docker push kooldev/php:${{ matrix.version }}-oci8-nginx-prod

          docker push kooldev/php:${{ matrix.version }}-oci8-swoole-nginx
          docker push kooldev/php:${{ matrix.version }}-oci8-swoole-nginx-prod
